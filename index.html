<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold the Keep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Pirata+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="brand">Hold the Keep</div>
      <div class="stat" title="Lives: the keep falls at zero">
        <svg viewBox="0 0 24 24" class="ico heart"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.5 1.1 5.3 3 1.8-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
        <span id="lives">20</span>
      </div>
      <div class="stat" title="Gold">
        <svg viewBox="0 0 24 24" class="ico coin"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5" class="inner"/></svg>
        <span id="gold">0</span>
      </div>
      <div class="stat wave-stat" title="Wave">
        <svg viewBox="0 0 24 24" class="ico swords"><path d="M4 3l8.5 8.5-1.6 1.6L2.4 4.6V3H4zm16 0h1.6v1.6l-6.3 6.3-1.6-1.6L20 3zM6.2 14.3l3.5 3.5-1.4 1.4-1.1-1.1-2.5 2.5-1.4-1.4 2.5-2.5-1.1-1.1 1.5-1.3zm11.6 0l1.4 1.4-1.1 1.1 2.5 2.5-1.4 1.4-2.5-2.5-1.1 1.1-1.4-1.4 3.6-3.6z"/></svg>
        <span>Wave <b id="wave">0</b><span id="waves-wrap"> / <span id="waves">20</span></span></span>
      </div>
      <div class="chip" id="mode-chip" style="display:none"></div>
      <div class="spacer"></div>
      <div class="seg" id="speed" title="Game speed (F)">
        <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="3">3×</button><button data-speed="5">5×</button>
      </div>
      <button class="icon-btn" id="btn-auto" title="Auto-call waves as soon as possible (A)">
        <svg viewBox="0 0 24 24"><path d="M3 6l8 6-8 6zM12 6l8 6-8 6z"/><text x="21" y="23" class="a-label">A</text></svg>
      </button>
      <button class="icon-btn" id="btn-pause" title="Pause (Space)">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L2 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8zM12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z" fill-rule="evenodd"/></svg>
      </button>
      <button class="btn wave-btn" id="btn-wave">Start Wave 1</button>
    </header>

    <main>
      <div id="stage">
        <div id="board">
          <canvas id="game"></canvas>
          <div id="banner"></div>
          <div id="toasts"></div>
          <div id="overlay" class="overlay show">
            <div class="loading">Raising the banners… <span id="load-pct">0%</span></div>
          </div>
        </div>
        <div id="command">
          <button id="hero-card" title="Sir Aldric (H): select, then click the map to send him there">
            <span class="portrait"><img id="hero-img" src="assets/units/hero.png" alt=""><span class="lvl" id="hero-lvl">1</span></span>
            <span class="hero-txt">
              <b id="hero-name">Sir Aldric</b>
              <span class="hbar"><i id="hero-hp"></i></span>
              <span class="hbar xp"><i id="hero-xp"></i></span>
            </span>
            <span class="respawn" id="hero-respawn"></span>
            <kbd>H</kbd>
          </button>
          <div class="group" id="abilities"></div>
          <div class="group" id="traps"></div>
        </div>
      </div>

      <aside id="side">
        <section class="panel">
          <h2>Build <span id="faction-chip" class="faction-chip"></span></h2>
          <div id="build-list"></div>
        </section>
        <section class="panel" id="info"></section>
        <section class="panel">
          <h2>Next wave</h2>
          <div id="next-wave"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="assets/manifest.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
